version: '3.8'

services:
  omnicache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnicache-proxy
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OMNICACHE_HOST=0.0.0.0
      - OMNICACHE_PORT=8000
      - SIMILARITY_THRESHOLD=0.92
      - EXACT_CACHE_TTL=604800
      - SEMANTIC_CACHE_TTL=604800
      - OMNICACHE_DB_PATH=/data/omnicache.db
    volumes:
      - omnicache_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  omnicache_data:
