[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicache-proxy"
version = "2.0.0"
description = "Zero-latency semantic caching and cost optimization proxy for LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "13manmayarai", email = "13manmayarai@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: Proxy Servers"
]
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0"
]

[project.scripts]
omnicache = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "server*", "persistence*", "mcp*"]
