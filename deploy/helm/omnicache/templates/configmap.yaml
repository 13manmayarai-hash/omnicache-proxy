apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "omnicache.fullname" . }}-config
  labels:
    {{- include "omnicache.labels" . | nindent 4 }}
data:
  OMNICACHE_HOST: {{ .Values.config.host | quote }}
  OMNICACHE_PORT: {{ .Values.config.port | quote }}
  REQUIRE_AUTH: {{ .Values.config.requireAuth | quote }}
  SIMILARITY_THRESHOLD: {{ .Values.config.similarityThreshold | quote }}
  EXACT_CACHE_TTL: {{ .Values.config.exactCacheTtl | quote }}
  SEMANTIC_CACHE_TTL: {{ .Values.config.semanticCacheTtl | quote }}
  CASCADE_POLICY: {{ .Values.config.cascadePolicy | quote }}
  MESH_ENABLED: {{ .Values.config.meshEnabled | quote }}
  MESH_GOSSIP_INTERVAL_SECS: {{ .Values.config.meshGossipInterval | quote }}
  MESH_HEARTBEAT_INTERVAL_SECS: {{ .Values.config.meshHeartbeatInterval | quote }}
  MESH_TOMBSTONE_TTL_SECS: {{ .Values.config.meshTombstoneTtl | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.persistence.enabled }}
  OMNICACHE_DB_PATH: "{{ .Values.persistence.mountPath }}/omnicache.db"
  {{- end }}
