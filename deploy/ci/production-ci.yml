name: OmniCache Production CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          pip install -e ".[test,dev]"

      - name: Run Test Suite (50 Unit & Integration Tests)
        run: |
          pytest tests/test_gateway.py \
                 tests/test_advanced.py \
                 tests/test_v3_2_improvements.py \
                 tests/test_p2p_mesh_sync.py \
                 tests/test_benchmark_suite.py \
                 tests/test_audit_export.py \
                 tests/test_sdk.py -v

      - name: Run High-Throughput Load Benchmark
        run: |
          python benchmarks/load_test.py --scenario all --requests 50 --concurrency 5

  build-and-lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: omnicache/proxy:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Kubernetes Helm Chart
        run: |
          helm lint deploy/helm/omnicache/
