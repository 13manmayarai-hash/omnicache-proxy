[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicache-proxy"
version = "3.0.5"
description = "Local acceleration sidecar, hardware-accelerated quantized embedder, distributed P2P edge mesh sync, multi-agent swarm delegation bus, Git-aware tool replayer, and cost arbiter for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "FSL-1.1-MIT"
authors = [
    { name = "Rajiv Prasad", email = "13manmayarai@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: Proxy Servers"
]
keywords = [
    "claude-code",
    "cursor",
    "cursor-ai",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-agents",
    "agentic-ai",
    "llm-cache",
    "semantic-cache",
    "prompt-caching",
    "tool-calling",
    "git-aware",
    "developer-tools",
    "token-optimization",
    "cost-optimization"
]
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0"
]
dev = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.urls]
"Homepage" = "https://github.com/13manmayarai-hash/omnicache-proxy"
"Documentation" = "https://github.com/13manmayarai-hash/omnicache-proxy#readme"
"Repository" = "https://github.com/13manmayarai-hash/omnicache-proxy.git"
"Issues" = "https://github.com/13manmayarai-hash/omnicache-proxy/issues"

[project.scripts]
omnicache = "server.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "server*", "persistence*", "mcp*", "dashboard*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]


