events {
    worker_connections 2048;
}

http {
    upstream omnicache_upstream {
        server omnicache:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Client body size for large multi-modal / context payloads
        client_max_body_size 50M;

        location / {
            proxy_pass http://omnicache_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for real-time Server-Sent Events (SSE) streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        location /healthz {
            proxy_pass http://omnicache_upstream/healthz;
            access_log off;
        }
    }
}
