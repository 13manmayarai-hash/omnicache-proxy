[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicache-proxy"
version = "2.6.1"
description = "Local acceleration sidecar and Git-aware tool replayer for AI coding agents (Claude Code, Cursor, Aider)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "13manmayarai", email = "13manmayarai@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: Proxy Servers"
]
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "redis>=5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0"
]
dev = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.urls]
"Homepage" = "https://github.com/13manmayarai-hash/omnicache-proxy"
"Documentation" = "https://github.com/13manmayarai-hash/omnicache-proxy#readme"
"Repository" = "https://github.com/13manmayarai-hash/omnicache-proxy.git"
"Issues" = "https://github.com/13manmayarai-hash/omnicache-proxy/issues"

[project.scripts]
omnicache = "server.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "server*", "persistence*", "mcp*", "dashboard*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]


